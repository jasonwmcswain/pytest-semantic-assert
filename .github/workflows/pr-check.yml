name: Pull Request Checks

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          echo "Installing linting dependencies..."
          python -m pip install --upgrade pip
          pip install black ruff mypy

      - name: Run Black check
        run: |
          echo "Running Black check..."
          black --check --diff pytest_semantic_assert tests

      - name: Run Ruff check
        run: |
          echo "Running Ruff check..."
          ruff check pytest_semantic_assert tests

      - name: Run MyPy check
        run: |
          echo "Running MyPy check..."
          mypy pytest_semantic_assert --verbose --pretty --no-incremental --cache-dir=/dev/null

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "Freeing up disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          echo "Installing dependencies..."
          python -m pip install --upgrade pip
          pip install --no-cache-dir -e ".[dev]"

      - name: Run tests with coverage
        run: |
          echo "Running tests with coverage..."
          pytest --cov=pytest_semantic_assert --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          echo "Installing build dependencies..."
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: |
          echo "Building package..."
          python -m build

      - name: Check package with twine
        run: |
          echo "Checking package with twine..."
          twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
