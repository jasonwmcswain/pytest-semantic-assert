name: Publish to PyPI

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      is_release: ${{ steps.check.outputs.is_release }}

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          echo "Extracting package version from pyproject.toml..."
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Package version: $VERSION"

      - name: Check if tag matches version
        id: check
        run: |
          echo "Checking if the push is a tag matching the package version..."
          if [[ ${{ github.ref_type }} == "tag" ]]; then
            TAG_VERSION=${GITHUB_REF#refs/tags/v}
            if [[ "$TAG_VERSION" == "${{ steps.get_version.outputs.version }}" ]]; then
              echo "is_release=true" >> $GITHUB_OUTPUT
              echo "✅ Tag version matches pyproject.toml version"
            else
              echo "is_release=false" >> $GITHUB_OUTPUT
              echo "❌ Tag version ($TAG_VERSION) does not match pyproject.toml version (${{ steps.get_version.outputs.version }})"
              exit 1
            fi
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Not a tag push, skipping release"
          fi

  test-full:
    name: Full Test Suite
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "Freeing up disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          echo "Installing dependencies..."
          python -m pip install --upgrade pip
          pip install --no-cache-dir -e ".[dev]"
          echo "✅ Dependencies installed successfully"

      - name: Pre-download ML models
        run: |
          echo "Pre-downloading ML models..."
          python -c "
          import sys
          print('Pre-downloading sentence-transformers models...')
          from sentence_transformers import SentenceTransformer
          print('Downloading default model...')
          model = SentenceTransformer('all-MiniLM-L6-v2')
          print('✅ Model downloaded successfully')
          "

      - name: Run full test suite
        run: |
          echo "Starting tests with coverage..."
          pytest --cov=pytest_semantic_assert --cov-report=term-missing --cov-report=xml -v --timeout=300
        env:
          PYTEST_TIMEOUT: 300

      - name: Check coverage threshold
        run: |
          echo "Checking coverage threshold..."
          COVERAGE=$(coverage report | grep TOTAL | awk '{print $4}' | sed 's/%//')
          echo "Current coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below 80% threshold"
            exit 1
          fi
          echo "✅ Coverage ${COVERAGE}% meets threshold"

  build-and-publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    needs: [validate, test-full]
    if: needs.validate.outputs.is_release == 'true'

    environment:
      name: pypi
      url: https://pypi.org/p/pytest-semantic-assert

    permissions:
      id-token: write  # Required for trusted publishing

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          echo "Installing build dependencies..."
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: |
          echo "Building package..."
          python -m build

      - name: Check package
        run: |
          echo "Checking package with twine..."
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          verbose: true

  test-install:
    name: Test Installation
    runs-on: ${{ matrix.os }}
    needs: [validate, build-and-publish]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Wait for PyPI to update
        run: |
          echo "Waiting for PyPI to update..."
          sleep 60

      - name: Install from PyPI
        run: |
          echo "Installing pytest-semantic-assert version ${{ needs.validate.outputs.version }} from PyPI..."
          pip install pytest-semantic-assert==${{ needs.validate.outputs.version }}
          pip show pytest-semantic-assert

      - name: Verify installation
        run: |
          echo "Verifying installation..."
          python -c "import pytest_semantic_assert; print(pytest_semantic_assert.__version__)"
          pytest --version | grep semantic

      - name: Create simple test
        run: |
          echo "Creating simple test file..."
          cat > test_install.py << 'EOF'
          def test_plugin_installed():
              from pytest_semantic_assert import assert_semantic
              assert True
          EOF

      - name: Run test with plugin
        run: |
          echo "Running test with plugin..."
          pytest test_install.py -v