[tox]
envlist = py{39,310,311,312}-pytest{70,71,80}
isolated_build = True
skip_missing_interpreters = True

[testenv]
description = Run tests with pytest
deps =
    pytest70: pytest>=7.0,<7.1
    pytest71: pytest>=7.1,<7.2
    pytest80: pytest>=8.0,<8.1
    pytest-cov
    pytest-xdist
    sentence-transformers
    numpy
    filelock
commands =
    pytest {posargs:tests/}

[testenv:coverage]
description = Run tests with coverage report
deps =
    pytest>=7.0
    pytest-cov
    pytest-xdist
    sentence-transformers
    numpy
    filelock
commands =
    pytest --cov=pytest_semantic_assert --cov-report=term-missing --cov-report=html --cov-report=xml {posargs:tests/}

[testenv:lint]
description = Run code quality checks (ruff, mypy, black)
deps =
    ruff
    mypy
    black
    pytest>=7.0
    sentence-transformers
    numpy
    filelock
commands =
    black --check src/ tests/
    ruff check src/ tests/
    mypy --verbose --pretty src/

[testenv:format]
description = Auto-format code with black
deps =
    black
commands =
    black src/ tests/

[testenv:docs]
description = Build documentation with sphinx
deps =
    sphinx
    sphinx-rtd-theme
    myst-parser
changedir = docs
commands =
    sphinx-build -W -b html . _build/html

[testenv:build]
description = Build distribution packages
deps =
    build
    twine
commands =
    python -m build
    twine check dist/*

[gh-actions]
python =
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312

